<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link href="static/styles.css" rel="stylesheet">
        <title>Portfolio</title>
    </head>
    <body>

        <form action="/index" method="GET">
            <button class="back-portfolio-element text-size" id="back-to-main-page">Back to main page</button>
        </form>

        <div id="black-rectangle-portfolio">
            
        </div>
        <div class="grey-complete">
            
        </div>

        <div class="white-line-vertical">
            
        </div>

        <div class="white-line-horizontal">
            
        </div>

        <div class="second-white-line-horizontal">
            
        </div>

        {% for portfolio_item in portfolio %}
        
        <img class="image-location-portfolio" src="{{ portfolio_item['image-address'] }}" alt="Missing image">
        <h1 class="portfolio-title">{{ portfolio_item['portfolio-item'] }}</h1>

        <a href="{{ portfolio_item['github-link'] }}" class="github-repository text-size">
            GitHub Repository
        </a>

        <h1 class="README-header">
            README
        </h1>
        <p class="README">
            {{ portfolio_item['readme']|add_linebreak|safe }}
        </p>
        {% endfor %}

        <script>
            document.getElementById("back-to-main-page").addEventListener("mouseover", function () {
            document.getElementById("back-to-main-page").style.textDecoration = "underline";
        });

            document.getElementById("back-to-main-page").addEventListener("mouseout", function () {
            document.getElementById("back-to-main-page").style.textDecoration = "none";
        });
        
        </script>
    </body>
</html>
